server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compression
    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/xml application/xml;

    # Images: cache 30 days
    location ~* \.(?:jpg|jpeg|png|webp|gif|ico|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public";
    }

    # CSS/JS: short cache, revalidate on deploy
    location ~* \.(?:css|js)$ {
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
    }

    # PHP (formulario de contacto)
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass unix:/run/php-fpm.sock;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_read_timeout 60s;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
